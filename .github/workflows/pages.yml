name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check Sensations Bois configuration
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SENSATIONS_BOIS_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          [[ "$VITE_SUPABASE_PUBLISHABLE_KEY" == sb_publishable_* ]] || { echo 'Missing or invalid Sensations Bois publishable key repository variable'; exit 1; }
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://dkfwiaulbapfbbrslavy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SENSATIONS_BOIS_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SCANNER_WRITES_ENABLED: 'false'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
